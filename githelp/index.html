<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="将 GitHub Release 文件下载链接转换为兰州大学开源镜像站链接。"
    />
    <title>GitHelp · GitHub Release 镜像助手</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050816;
        --panel: rgba(12, 18, 40, 0.86);
        --line: rgba(148, 163, 184, 0.24);
        --text: #eef2ff;
        --muted: #9ca3af;
        --cyan: #38bdf8;
        --violet: #8b5cf6;
        --danger: #fb7185;
        --success: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 12% 5%, rgba(56, 189, 248, 0.2), transparent 34rem),
          radial-gradient(circle at 90% 86%, rgba(139, 92, 246, 0.22), transparent 32rem),
          var(--bg);
      }

      .shell {
        width: min(920px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: clamp(4rem, 11vh, 8rem);
      }

      .brand {
        color: var(--text);
        font-weight: 850;
        letter-spacing: 0.11em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand span {
        color: var(--cyan);
      }

      .back {
        color: var(--muted);
        font-size: 0.92rem;
        text-decoration: none;
      }

      .back:hover {
        color: var(--text);
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.7rem);
        line-height: 1.03;
        letter-spacing: -0.055em;
      }

      .lead {
        max-width: 670px;
        margin: 1.4rem 0 2.2rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.12rem);
        line-height: 1.8;
      }

      .card {
        padding: clamp(1.2rem, 4vw, 2rem);
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--panel);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px);
      }

      label {
        display: block;
        margin-bottom: 0.65rem;
        font-size: 0.9rem;
        font-weight: 700;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 132px;
        resize: vertical;
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 1rem;
        outline: none;
        padding: 1rem;
        color: var(--text);
        background: rgba(2, 6, 23, 0.78);
        font: 0.92rem/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      textarea:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      button,
      .result-link {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          opacity 0.16s ease;
      }

      button:hover,
      .result-link:hover {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
        transform: none;
      }

      .primary {
        color: white;
        background: linear-gradient(110deg, #0284c7, var(--violet));
      }

      .secondary {
        color: var(--text);
        border: 1px solid var(--line);
        background: rgba(30, 41, 59, 0.78);
      }

      .sample {
        margin-left: auto;
        color: var(--muted);
        background: transparent;
      }

      .status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      .result {
        display: none;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }

      .result.visible {
        display: block;
      }

      .result-grid {
        display: grid;
        gap: 0.8rem;
      }

      .result-row {
        display: grid;
        grid-template-columns: 7rem minmax(0, 1fr);
        gap: 0.75rem;
        align-items: start;
        font-size: 0.9rem;
      }

      .result-row span {
        color: var(--muted);
      }

      code {
        overflow-wrap: anywhere;
        color: #dbeafe;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .result-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1rem;
        color: white;
        text-decoration: none;
        background: linear-gradient(110deg, #059669, #0284c7);
      }

      .notice {
        margin-top: 1rem;
        color: #94a3b8;
        font-size: 0.82rem;
        line-height: 1.65;
      }

      @media (max-width: 620px) {
        .shell {
          width: min(100% - 1.2rem, 920px);
          padding-top: 1.2rem;
        }

        .topbar {
          margin-bottom: 3.5rem;
        }

        .sample {
          width: 100%;
          margin-left: 0;
          text-align: left;
          padding-left: 0.2rem;
        }

        .result-row {
          grid-template-columns: 1fr;
          gap: 0.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="../">Cyber<span>Blade</span></a>
        <a class="back" href="../">返回个人主页</a>
      </header>

      <main>
        <p class="eyebrow">GitHub Release Mirror Helper</p>
        <h1>粘贴链接，转到兰大镜像。</h1>
        <p class="lead">
          输入一个 GitHub Release 文件下载链接。GitHelp 会查询对应的发布标题，
          生成兰州大学开源镜像站地址，并在你确认后前往下载。
        </p>

        <section class="card" aria-labelledby="converter-title">
          <form id="converter">
            <label id="converter-title" for="github-url">GitHub Release 下载链接</label>
            <textarea
              id="github-url"
              name="url"
              required
              spellcheck="false"
              autocomplete="off"
              placeholder="https://github.com/OWNER/REPO/releases/download/TAG/FILE.zip"
            ></textarea>

            <div class="actions">
              <button class="primary" id="go-button" type="submit">
                转换并前往下载
              </button>
              <button class="secondary" id="convert-button" type="button">
                仅生成链接
              </button>
              <button class="sample" id="sample-button" type="button">
                填入示例
              </button>
            </div>
          </form>

          <p class="status" id="status" role="status" aria-live="polite"></p>

          <div class="result" id="result">
            <div class="result-grid">
              <div class="result-row">
                <span>仓库</span>
                <code id="repo-output"></code>
              </div>
              <div class="result-row">
                <span>Release 标题</span>
                <code id="release-output"></code>
              </div>
              <div class="result-row">
                <span>镜像地址</span>
                <code id="mirror-output"></code>
              </div>
            </div>
            <a
              class="result-link"
              id="result-link"
              href="#"
              target="_self"
              rel="noreferrer"
            >
              前往兰大镜像
            </a>
          </div>

          <p class="notice">
            说明：仅支持 github.com 的
            <code>/releases/download/</code> 文件链接。兰大镜像只收录部分开源项目；
            转换成功不代表目标文件一定已被镜像站同步。
          </p>
        </section>
      </main>
    </div>

    <script>
      (() => {
        "use strict";

        const form = document.getElementById("converter");
        const input = document.getElementById("github-url");
        const goButton = document.getElementById("go-button");
        const convertButton = document.getElementById("convert-button");
        const sampleButton = document.getElementById("sample-button");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const repoOutput = document.getElementById("repo-output");
        const releaseOutput = document.getElementById("release-output");
        const mirrorOutput = document.getElementById("mirror-output");
        const resultLink = document.getElementById("result-link");

        const exampleUrl =
          "https://github.com/YerongAI/Office-Tool/releases/download/v11.7.9.0/Office_Tool_with_runtime_v11.7.9.0_x64.zip";

        const setStatus = (message, kind = "") => {
          status.textContent = message;
          status.className = kind ? `status ${kind}` : "status";
        };

        const setBusy = (busy) => {
          goButton.disabled = busy;
          convertButton.disabled = busy;
          sampleButton.disabled = busy;
        };

        const decodePart = (part) => {
          try {
            return decodeURIComponent(part);
          } catch {
            throw new Error("链接中包含无效的 URL 编码。");
          }
        };

        const parseReleaseUrl = (value) => {
          let url;
          try {
            url = new URL(value.trim());
          } catch {
            throw new Error("请输入完整、有效的 HTTPS 链接。");
          }

          if (url.protocol !== "https:" || url.hostname.toLowerCase() !== "github.com") {
            throw new Error("只支持 https://github.com 上的链接。");
          }

          const match = url.pathname.match(
            /^\/([^/]+)\/([^/]+)\/releases\/download\/([^/]+)\/(.+)$/,
          );
          if (!match) {
            throw new Error("这不是 GitHub Release 文件下载链接。");
          }

          const [, ownerPart, repoPart, tagPart, assetPart] = match;
          return {
            owner: decodePart(ownerPart),
            repo: decodePart(repoPart),
            tag: decodePart(tagPart),
            asset: assetPart
              .split("/")
              .map(decodePart)
              .join("/"),
          };
        };

        const resolveMirrorUrl = async (parts) => {
          const apiUrl =
            `https://api.github.com/repos/${encodeURIComponent(parts.owner)}/` +
            `${encodeURIComponent(parts.repo)}/releases/tags/${encodeURIComponent(parts.tag)}`;
          const response = await fetch(apiUrl, {
            headers: {
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });

          if (!response.ok) {
            if (response.status === 404) {
              throw new Error("未找到对应的 GitHub Release，请检查仓库、标签和文件名。");
            }
            if (response.status === 403) {
              throw new Error("GitHub API 暂时限流，请稍后再试。");
            }
            throw new Error(`GitHub API 请求失败（HTTP ${response.status}）。`);
          }

          const release = await response.json();
          const releaseName = (release.name || release.tag_name || parts.tag).trim();
          const assetExists = Array.isArray(release.assets)
            ? release.assets.some((asset) => asset.name === parts.asset)
            : true;

          if (!assetExists) {
            throw new Error("该 Release 中没有这个文件，请粘贴资产的完整下载链接。");
          }

          const mirrorPath =
            `/github-release/${parts.owner}/${parts.repo}/` +
            `${releaseName}/${parts.asset}`;
          return {
            releaseName,
            mirrorUrl:
              `https://mirror.lzu.edu.cn/testpow/?url=${encodeURIComponent(mirrorPath)}`,
          };
        };

        const convert = async (shouldRedirect) => {
          result.classList.remove("visible");
          setBusy(true);
          setStatus("正在解析链接并查询 GitHub Release…");

          try {
            const parts = parseReleaseUrl(input.value);
            const resolved = await resolveMirrorUrl(parts);

            repoOutput.textContent = `${parts.owner}/${parts.repo}`;
            releaseOutput.textContent = resolved.releaseName;
            mirrorOutput.textContent = resolved.mirrorUrl;
            resultLink.href = resolved.mirrorUrl;
            result.classList.add("visible");
            setStatus("转换成功。即将前往兰大镜像。", "success");

            if (shouldRedirect) {
              window.location.assign(resolved.mirrorUrl);
            }
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "转换失败，请稍后再试。", "error");
          } finally {
            setBusy(false);
          }
        };

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          convert(true);
        });

        convertButton.addEventListener("click", () => convert(false));
        sampleButton.addEventListener("click", () => {
          input.value = exampleUrl;
          input.focus();
          setStatus("示例已填入，可以直接转换。");
        });

        const sharedUrl = new URLSearchParams(window.location.search).get("url");
        if (sharedUrl) input.value = sharedUrl;
      })();
    </script>
  </body>
</html>
